<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>智能路由</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%235b5bd6'/><path d='M9 21l5-8 4 5 5-7' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <div class="app">
    <aside class="side">
      <div class="brand"><span class="logo" id="logo"></span><b>智能路由</b></div>
      <nav class="nav" id="nav" aria-label="页面"></nav>
      <div class="conn" id="conn" role="status"><span class="dot"></span><span class="txt">连接中</span></div>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <dialog id="modal" class="modal" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="btn ghost icon" data-close aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </dialog>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
